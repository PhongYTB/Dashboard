name: Update Key

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  update-key:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update key.json
        run: |
          FILE="key.json"
          KEYS=(
            "FREE_PhonghubOT$(date +%s | sha256sum | head -c6)"
            "FREE_PhonghubMz$(date +%s | sha256sum | head -c6)"
            "FREE_PhonghubMj$(date +%s | sha256sum | head -c6)"
            "FREE_PhonghubND$(date +%s | sha256sum | head -c6)"
            "FREE_PhonghubOD$(date +%s | sha256sum | head -c6)"
          )
          echo "[" > $FILE
          for KEY in "${KEYS[@]}"; do
            echo "  \"$KEY\"," >> $FILE
          done
          sed -i '$ s/,$//' $FILE
          echo "]" >> $FILE

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add key.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto update key.json"
            git push
          else
            echo "No changes to commit"
