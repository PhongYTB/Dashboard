<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phong Hub Key</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  height: 100vh;
  text-align: center;
}
h1 {
  color: red;
}
.key {
  background: red;
  padding: 15px 20px;
  border-radius: 12px;
  margin-top: 15px;
}
.btn {
  margin-top: 10px;
  padding: 12px 25px;
  background: white;
  color: red;
  border: none;
  border-radius: 10px;
}
</style>
</head>
<body>

<script>
const p = new URLSearchParams(window.location.search);
const id = p.get("id");

const sid = localStorage.getItem("kid");
const time = localStorage.getItem("ktime");
const now = Date.now();

// thời gian test 30s
const limit = 30000;

// điều kiện anti bypass
if (!id || id !== sid) {
  document.body.innerHTML = "<h1>Anti Bypass From Phong</h1>";
} else if (now - time > limit) {
  document.body.innerHTML = "<h1>Anti Bypass From Phong</h1>";
} else {
  document.body.innerHTML = `
    <h1>Phong Hub Key System</h1>
    <div class="key" id="key">FREE_Phonghub01382919</div>
    <button class="btn" onclick="copyKey()">Copy</button>
  `;
}

function copyKey() {
  navigator.clipboard.writeText(document.getElementById("key").innerText);
  alert("Đã copy key");
}

// tự chuyển sang anti bypass sau 30s
setTimeout(() => {
  document.body.innerHTML = "<h1>Anti Bypass From Phong</h1>";
}, limit);
</script>

</body>
</html>
