<!DOCTYPE html>
<html>
<head>
<meta charset="UTF8">
<title>Phong Get Key</title>
</head>
<body style="textalign:center;paddingtop:40px;fontsize:20px;">
<p>Here key</p>
<button onclick="goKey()" style="padding:10px 20px;fontsize:18px;">Get Key</button>

<script>
function makeID() {
    let t = Date.now() + Math.random();
    return btoa(t).replace(/=/g,"");
}
function goKey() {
    let id = makeID();
    localStorage.setItem("kid", id);
    localStorage.setItem("ktime", Date.now());
    window.location.href = "key.html?id=" + id;
}
</script>
</body>
</html>
