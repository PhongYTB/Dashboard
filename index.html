<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phong Hub Key System</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  height: 100vh;
}
h1 {
  color: red;
  margin-bottom: 30px;
}
.btn {
  background: red;
  color: white;
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
}
</style>
</head>
<body>

<h1>Phong Hub Key System</h1>
<button class="btn" onclick="makeKey()">Get Key</button>

<script>
function makeID() {
  return btoa(Date.now() + Math.random()).replace(/=/g, "");
}

function makeKey() {
  let id = makeID();
  localStorage.setItem("kid", id);
  localStorage.setItem("ktime", Date.now());
  window.location.href = "key.html?id=" + id;
}
</script>

</body>
</html>
